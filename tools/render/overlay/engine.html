<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--primary:#555555;--ink:#111111;--paper:#FAFAFA;--error:#E63946;--muted:#6B7280;--font:Inter,system-ui,sans-serif}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:var(--font)}
.abs{position:absolute}
/* screen-moment: phone */
.phone{left:0;top:0;width:448px;height:974px;border-radius:62px;background:#0B0F1A;padding:9px;box-sizing:border-box;box-shadow:0 30px 70px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.25);transform-origin:0 0;opacity:0}
.scr{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#FFFDF9}
.scr img{position:absolute;left:-4.85px;top:0;width:439.7px;height:956px;opacity:0}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(56,69,255,.28);border:4px solid rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;z-index:5}
/* captions */
.cap{top:1360px;font-weight:800;font-size:66px;line-height:1.12;color:#fff;-webkit-text-stroke:11px rgba(10,12,20,.92);paint-order:stroke fill;letter-spacing:-.5px}
.cap .on{color:#fff;background:var(--primary);-webkit-text-stroke:0;border-radius:16px;padding:0 12px 4px;margin:0 -4px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* hook: kinetic-labels */
.hookline{left:0;width:1080px;text-align:center}
.hl{display:inline-block;font-weight:900;font-size:60px;padding:8px 24px 14px;white-space:nowrap;border-radius:18px;letter-spacing:-1.5px;box-shadow:0 10px 30px rgba(15,23,42,.35)}
.hl.ink{background:var(--ink);color:var(--paper)}
.hl.paper{background:var(--paper);color:var(--ink)}
.hl.primary{background:var(--primary);color:#fff}
/* emphasis: stamp */
.stamp{width:360px;height:360px;border-radius:50%;background:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.35);border:10px solid #fff;opacity:0}
.stamp .a{font-weight:900;font-size:66px;color:#fff;letter-spacing:4px}
.stamp .b{font-weight:900;font-size:170px;line-height:.9;color:#fff}
/* emphasis: big-kinetic */
.big{left:0;width:1080px;text-align:center;opacity:0}
.big .t{display:inline-block;font-weight:900;font-size:170px;color:#fff;letter-spacing:-4px;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill}
.big .t.accent{color:var(--primary);-webkit-text-stroke:14px #fff}
/* emphasis: stacked-chips */
.chip{left:60px;display:flex;align-items:center;gap:22px;background:#fff;border-radius:26px;padding:22px 34px 22px 22px;box-shadow:0 14px 36px rgba(0,0,0,.28);opacity:0}
.chip .ic{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:46px}
.chip .tx{font-weight:800;font-size:54px;color:var(--ink);letter-spacing:-1px}
/* emphasis: sticker */
.sticker{background:var(--primary);color:#fff;border-radius:30px;padding:16px 30px 20px;font-weight:900;font-size:92px;letter-spacing:-2px;box-shadow:0 16px 36px rgba(0,0,0,.35);border:7px solid var(--paper);opacity:0;transform-origin:50% 50%}
.sticker small{display:block;font-size:34px;letter-spacing:0;font-weight:800;margin-top:-4px}
/* emphasis: page-flip */
.cal{left:290px;top:1000px;width:500px;border-radius:44px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4);opacity:0;background:#fff;text-align:center}
.cal .h{background:var(--primary);color:#fff;font-weight:900;font-size:62px;padding:26px 0;letter-spacing:2px}
.cal .d{font-weight:900;font-size:230px;color:var(--primary);line-height:1.05;padding:10px 0 0}
.cal .s{font-weight:800;font-size:46px;color:var(--ink);padding:0 0 34px}
/* badge */
.badge{left:160px;width:760px;height:190px;border-radius:48px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.3);display:flex;align-items:center;opacity:0}
.badge img{width:130px;height:130px;border-radius:30px;margin:0 30px}
.badge .a{font-weight:800;font-size:46px;color:var(--ink)}
.badge .b{font-weight:500;font-size:36px;color:var(--muted);margin-top:8px}
/* series tag */
.tag{left:34px;top:150px;color:var(--primary);font-weight:900;font-size:58px;letter-spacing:1px;-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0}
/* transitions */
.wipe{left:0;top:0;width:1080px;height:1920px;opacity:0}
.bar{position:absolute;top:-400px;height:2800px;transform:rotate(18deg)}
.iris{left:0;top:0;width:1080px;height:1920px;background:var(--primary);opacity:0}
/* outro */
.outro{left:0;top:0;width:1080px;height:1920px;background:var(--primary);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.outro .l{font-weight:900;font-size:150px;color:#fff;letter-spacing:-4px;line-height:1.02}
.outro .pill{font-weight:800;font-size:46px;color:var(--primary);background:#fff;border-radius:999px;padding:16px 40px 20px;margin-top:60px}
.outro .foot{display:flex;align-items:center;gap:18px;margin-top:120px;color:#fff;font-weight:800;font-size:38px;opacity:.95}
.outro .foot img{width:76px;height:76px;border-radius:18px}
</style>
</head>
<body>
<script src="engine.js"></script>
</body>
</html>
